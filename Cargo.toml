[package]
name = "terrarium"
version = "0.1.0"
edition = "2024"
description = "Experiment: capability-checked, journaled, replayable agent sandbox on Wasmer"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"
wasmer = "7.5"
wasmer-middlewares = "7.5"
